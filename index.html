      <h4>為什麼是這樣</h4><dl class="why"><dt>快清為什麼拿得到錢？</dt><dd>市府按來電通數付錢，驗收只看一張施工照片：「目視無明顯垃圾」就算交差，合約沒寫垃圾要送去哪。港邊的瓶子、袋子、保麗龍曬了好幾個月，早就又硬又脆。快清用的是清落葉、清沙灘的老方法：鼓風機一吹、耙子一刮，大塊的碎成小塊，輕的被吹進水溝。幾公釐的碎片，照片上本來就看不見。不用載、不用排隊、不付處理費，所以錢全進口袋。可是碎片還在港裡，會繼續碎下去。</dd><dt>收走為什麼只拿一半？</dt><dd>收走要戴手套一件一件撿、整袋開車載到處理場，排隊等阿庫一袋一袋秤重。處理場照重量收處理費，從來電的錢裡扣掉一半。少賺，但東西進了管得到的地方，以後不會被查。</dd><dt>現實裡真的有這種事嗎？</dt><dd>有。英國有海灘每天用機器耙沙，志工在沙裡撿到幾百片碎掉的沙灘玩具，要求市議會改掉清法。國外也有很多城市規定不准用鼓風機把東西吹進水溝，因為雨水下水道不經過污水處理廠，直接通到河和海。塑膠曬久了會變脆，再被刮、被吹、被浪打，就會越碎越小。</dd><dt>打零工是什麼？</dt><dd>${SIDE_UI.odd}——你在幫市府審自己交的照片。</dd><dt>爆料是什麼？</dt><dd>${SIDE_UI.leak}想讓對手早點被罰，就要讓報社早點換上放大鏡。</dd></dl>
      <h4>來電 ☎</h4><p>來電通數＝有多少人看得見它。大塊：單子上的數字，沒人接會越打越多。碎片：1 通，報社換放大鏡後變 2 通。微粒：沒人看得見，所以 0 通；送實驗室之後大家都知道了，可是已經收不走。</p>
      <h4>晨報與本月重點</h4><p>每個月一號先看晨報：這個月的天氣（先講好的，不會變）、報社還差幾點、海灣和處理場剩多少。市府每個月有一個重點，只在那個月有效：${Object.entries(GOALS).filter(([key]) => key !== 'routine').map(([, x]) => `<b>${x.name}</b>（${x.rule.replace('這個月', '')}）`).join('、')}。</p>
      <h4>河水</h4><p>微粒每個月往下游漂一區；碎片只在暴雨時被沖走。港口再往下就是海灣。</p>
      <h4>報社調查</h4><p>報社負責讓大家看見；錢是照合約第四條賠給市府。每個月 +1；快清多、有單進海灣、處理場溢出來、有人爆料，都會更快。換放大鏡：河岸上有你章的碎片，每張賠 1 萬。送實驗室：河裡和海灣裡有你章的微粒，每張賠 1 萬。年終：處理場以外的碎片和微粒再算一次。處理場裡的永遠不賠。</p>
      <h4>你的章</h4><p>地圖上有你公司小章的單，就是你蓋過的。紅色「−1」是報社下次換工具時會賠的。左下角有算好的總數。</p>
      <h4>處理場</h4><p>滿了不能再收走。遇到暴雨，最後進去的箱子會被沖回工坊區，章還在。</p></div>
      <div class="sb2"><button data-a="sheet" data-v="how">${HOW.open}</button><button data-a="tourstart">重看教學</button></div>`;
  } else if (k === 'how') {

let tlTimers = [], tlMoveOn = false;

function yePlan(g) {
  const f = S.yeFines || {}, C = E.CONFIG;
  const rows = g.players.map((p, i) => {
    const s = p.stats, ye = (f[i] || []).length * C.fineYE, tech = p.techs.reduce((a, t) => a + C.tech[t], 0);
    return { i, start: C.startMoney, income: s.income, tech, invest: s.invested, leak: s.leak, fine: s.paid - ye, ye, bonus: s.bonus || 0, total: p.money, yeN: (f[i] || []).length };
  });
  const keys = ['start', 'income', 'spend', 'fine'].concat(rows.some(r => r.bonus) ? ['bonus'] : []);
  const delta = (r, k) => k === 'start' ? r.start : k === 'income' ? r.income : k === 'spend' ? -(r.tech + r.invest + r.leak) : k === 'fine' ? -(r.fine + r.ye) : r.bonus;
  rows.forEach(r => { let v = 0; r.d = keys.map(k => delta(r, k)); r.v = r.d.map(d => (v += d)); r.v[r.v.length - 1] = r.total; });
  return { rows, keys, max: Math.max(1, ...rows.flatMap(r => r.v)) };
}

  if (!g.collapsed) { const ev = E.yearEnd(g); S.yeFines = ev[0].fines; S.bonus = ev[1] ? ev[1].bonus : null; }

async function aiTurn(p) {
  const g = S.g; S.aiThinking = true; await sleep(280);

function payHow(type, c) {

}

// ---------- 文字自動縮放：確保文字不超出模板的格子 ----------
function fitBox(el, oneLine) {
  el.style.fontSize = ''; const kids = [el, ...el.querySelectorAll('*')];
  kids.forEach(k => k.style.fontSize = '');
  if (innerWidth <= 760 && el.classList.contains('dtext')) return;   // 手機上合約是一般排版，照 CSS 的字級，不用縮
  const base = kids.map(k => parseFloat(getComputedStyle(k).fontSize));
  const over = () => oneLine ? el.scrollWidth > el.clientWidth + 1 : (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
  let f = 1;
  while (over() && f > 0.45) { f -= 0.05; kids.forEach((k, i) => k.style.fontSize = (base[i] * f) + 'px'); }
}
function fitAll() { document.querySelectorAll('[data-fit]').forEach(e => fitBox(e)); document.querySelectorAll('[data-fit1]').forEach(e => fitBox(e, true)); }

function loadImg(src) {
  return new Promise(res => { const i = new Image(); i.decoding = 'async'; i.onload = () => (i.decode ? i.decode() : Promise.resolve()).then(res, res); i.onerror = res; i.src = src; });
}
const loadedAssets = new Set();
function preloadScreen(screen) {
  const patterns = {setup:/company_|stamp_|setup_board|ui_/,intro:/intro_v2|contract|ui_/,game:/map_|thumb_|stamp_|icon_|ic_|token_|decide_|ui_|desk_|board_|boss_|district_|plant|printer|card_|photo_/,ending:/ending_|poster_|a1/,story:/specimen_|bay_|icon_(eye|magnifier|microscope)|force_|zoom_|drop_|stamp_whale|branch_|mp_|src_|flake_|sort_tank|stop_|out_|drift_|town_|rpet|sludge|rain_cloud|street_|drain_net|pellet_trap/};
  const pattern=patterns[screen]; if(!pattern) return;
  const pending=ASSETS.filter(a=>pattern.test(a)&&!loadedAssets.has(a));
  pending.forEach(a=>loadedAssets.add(a));
  (async()=>{for(let i=0;i<pending.length;i+=4) await Promise.all(pending.slice(i,i+4).map(loadImg));})();
}
// 動態效果：玩家在進階設定選過，就照玩家的；沒選過，才跟著電腦的「減少動態」設定。
// （以前是「玩家選減少 或 電腦設定減少」，電腦開了減少動態時，按「完整」會被蓋回去。）
const sysRM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function applyMotion() {
  const m = Atlas.motion();
  RM = m === 'low' ? true : m === 'full' ? false : sysRM();
  S.lowMotion = RM;
  document.body.classList.toggle('low-motion', RM);
}
function boot() {
  FX.init();
  applyMotion();
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', applyMotion);
  render();
}
boot();
