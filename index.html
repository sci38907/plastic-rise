<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塑界崛起｜貝洛港清潔公司</title>
<link rel="icon" href="img/stamp_whale.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#0E2A3A;--abyss2:#163B4F;--tide:#E8F0EE;--tide2:#D7E5E1;--surface:#FFFFFF;--ink:#13303D;--muted:#5E7680;--line:#C5D6D2;
  --scope:#4FD6CF;--marker:#FFC94A;--alarm:#E0473A;--kelp:#3F7A5A;--water:#7FB3AD;--deep:#1F4E66;
  --paper:#FBF8F0;--pink:#2E3A4F;--paperline:#D8CFBD;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  font-family:var(--sans);color:var(--ink);font-feature-settings:"palt" 1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--tide)}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;line-height:1.25;transition:background .15s,border-color .15s,transform .15s}
button:hover:not(:disabled){border-color:var(--ink)}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:3px solid var(--scope);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
button.on{background:var(--ink);border-color:var(--ink);color:#fff}
button.big,.pill.pri{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;padding:11px 26px;font-size:16px}
button.big:hover:not(:disabled),.pill.pri:hover:not(:disabled){background:var(--abyss2)}
.pill{padding:11px 26px;font-size:16px}
button small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:1px}
small{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}

/* ===== 標題 ===== */
.title{flex:1;background:var(--abyss);color:#fff;display:flex;flex-direction:column;overflow:auto}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 10px}
.hero h1{font-size:clamp(44px,7.6vw,104px);font-weight:900;letter-spacing:.04em;margin:0;line-height:1.05}
.tag{font-size:clamp(18px,2.2vw,26px);font-weight:500;color:#BFD6D3;margin:14px 0 0;letter-spacing:.08em}
.shrink{width:min(620px,92vw);margin:18px 0 6px}
.hs{width:100%;height:auto;display:block}
.g0,.g1,.g2{transform-origin:300px 150px}
.g0{animation:g0 10s infinite}.g1{animation:g1 10s infinite}.g2{animation:g2 10s infinite}
.g1 .sh{animation:sh 10s infinite}
@keyframes g0{0%,24%{opacity:1;transform:none}30%{opacity:0;transform:scale(1.08) rotate(6deg)}100%{opacity:0}}
@keyframes g1{0%,24%{opacity:0}28%,55%{opacity:1;transform:none}64%{opacity:0;transform:scale(.25)}100%{opacity:0}}
@keyframes sh{0%,26%{transform:translate(0,0)}55%{transform:translate(var(--dx),var(--dy)) rotate(25deg)}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes g2{0%,58%{opacity:0;transform:scale(.6)}66%,92%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.04)}}
.caps{position:relative;height:28px;font-size:15px;color:#9FC2BE;letter-spacing:.06em}
.caps span{position:absolute;inset:0;opacity:0}
.caps .c0{animation:c0 10s infinite}.caps .c1{animation:c1 10s infinite}.caps .c2{animation:c2 10s infinite}
@keyframes c0{0%,24%{opacity:1}28%,100%{opacity:0}}
@keyframes c1{0%,27%{opacity:0}31%,56%{opacity:1}60%,100%{opacity:0}}
@keyframes c2{0%,61%{opacity:0}66%,92%{opacity:1}97%,100%{opacity:0}}
.tb2{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.title .pill{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.title .pill:hover{border-color:#fff}
.title .pill.pri{background:#fff;color:var(--abyss);border-color:#fff}
.title .pill.pri:hover{background:var(--scope);border-color:var(--scope)}
.blurb{max-width:30em;text-wrap:balance;color:#9FC2BE;font-size:15px;line-height:1.8;margin:22px 0 0}
.ver{text-align:center;font-size:12px;color:#6F9A98;padding:12px}
@media (prefers-reduced-motion:reduce){.g0,.g1,.g2,.g1 .sh,.caps span{animation:none}.g0,.g1{opacity:0}.g2{opacity:1}.caps .c2{opacity:1}.flow{animation:none!important}}

/* ===== 設定 ===== */
.setup{flex:1;overflow:auto;padding:44px max(28px,6vw)}
.setup h2{font-size:40px;font-weight:900;margin:0}
.sublead{color:var(--muted);font-size:16px;margin:6px 0 18px}
.row{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.lab{font-size:14px;color:var(--muted);min-width:56px}
.row.small button{font-size:13px;padding:4px 12px}
.seats{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 12px}
.seat{width:250px;background:var(--surface);border-radius:20px;padding:16px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(19,48,61,.35);border-top:6px solid var(--c)}
.sh{font-size:12px;color:var(--muted)}
.sn{font-weight:900;font-size:20px;color:var(--c);margin-top:4px}
.sm{font-size:14px;margin-top:2px}.sw{font-size:12px;color:var(--muted);margin-top:2px}
.cos{display:flex;gap:6px;margin:10px 0 4px}
.cob{width:40px;height:40px;padding:0;border:2px solid var(--c);color:var(--c);font-family:var(--serif);font-weight:900;font-size:16px}
.cob.on{background:var(--c);color:#fff;border-color:var(--c)}
#seed{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:999px;width:150px;background:#fff}

/* ===== 序幕 ===== */
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;background:var(--abyss);color:#fff}
.frame{width:min(960px,88vw);aspect-ratio:16/8;max-height:58vh;border-radius:18px;background:var(--abyss2);display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,.18)}
.ph{color:#6F9A98;font-size:15px}
.sub{font-size:clamp(22px,3vw,36px);font-weight:700;margin-top:28px;letter-spacing:.04em}
.dots{display:flex;gap:8px;margin-top:18px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.on{background:#fff}
.ic{font-size:13px;color:#6F9A98;margin-top:12px}
.skip{position:absolute;top:18px;right:18px;background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}

/* ===== 合約（劇中紙本）===== */
.contract{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:36px 20px;background:var(--abyss)}
.doc{width:min(760px,94vw);background:var(--paper);color:var(--pink);padding:34px 46px;border-radius:4px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.doc h2{font-family:var(--serif);text-align:center;font-size:22px}
.doc p{font-family:var(--serif);font-size:16px;line-height:2;margin:4px 0}
.emb{width:58px;height:58px;border-radius:50%;border:2px solid var(--pink);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;font-family:var(--serif)}
.sigs{display:flex;gap:18px;justify-content:center;margin:22px 0 8px;flex-wrap:wrap}.sig{text-align:center;font-size:13px}
.sb{width:74px;height:74px;border:1.5px dashed var(--pink);margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.sig button{margin-top:6px;padding:4px 14px;font-size:13px}
.doc .big{display:block;margin:14px auto 0}

/* ===== 主畫面：頂列 ===== */
.top{display:flex;align-items:center;gap:20px;padding:10px 18px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:relative;z-index:3}
.paper{flex:1;display:flex;gap:12px;align-items:center;min-width:0}
.mast,.npm{font-family:var(--serif);font-weight:900;letter-spacing:.12em;white-space:nowrap}
.top .mast{font-size:15px;padding-right:12px;border-right:1px solid var(--line)}
.pt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.pt b{color:var(--ink)}
.scope{width:330px;flex:none}
.steps{display:flex;align-items:center;gap:6px}
.st{display:flex;align-items:center;gap:5px;font-size:13px;color:#9AB0B4}.st svg{width:18px;height:18px}
.st.on{color:var(--ink)}.st.now{color:var(--abyss);font-weight:700}
.st.now svg{color:#fff;background:var(--abyss);border-radius:50%;padding:3px;width:24px;height:24px;box-shadow:0 0 0 3px rgba(79,214,207,.45)}
.sl{flex:1;height:1px;background:var(--line)}
.tb{position:relative;height:4px;border-radius:4px;background:var(--tide2);margin:7px 0 4px}
.tf{height:100%;background:var(--abyss);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tb i{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink);opacity:.5}
.tl{font-size:11px;color:var(--muted)}
.rd{display:flex;align-items:baseline;gap:2px;white-space:nowrap}.rd b{font-size:30px;font-weight:900;line-height:1}.rd span{font-size:13px;color:var(--muted)}
.demo{display:flex;gap:4px}.demo button{padding:4px 11px;font-size:13px}

/* ===== 主畫面：地圖 ===== */
.mid{flex:1;display:flex;min-height:0}
.map{flex:1;display:flex;gap:10px;padding:14px 14px 0;min-width:0;position:relative;background:var(--tide)}
.riverband{position:absolute;left:0;right:0;bottom:0;height:52px;width:100%;z-index:0}
.flow{animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-48}}
.dist{flex:1;display:flex;flex-direction:column;border-radius:18px;background:rgba(255,255,255,.55);position:relative;min-width:0;overflow:hidden;z-index:1;margin-bottom:28px;box-shadow:inset 0 0 0 1px rgba(19,48,61,.08)}
.dn{font-weight:900;font-size:16px;padding:10px 12px 6px;display:flex;gap:8px;align-items:baseline}
.dn small{font-weight:500}
.dn em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;background:var(--marker);color:var(--ink);border-radius:999px;min-width:22px;text-align:center;padding:1px 6px}
.dn em:empty{display:none}
.dc{flex:1;overflow-y:auto;padding:4px 10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bay{width:132px;border-radius:18px;background:var(--deep);color:#fff;display:flex;flex-direction:column;align-items:center;padding:10px 6px;z-index:1;margin-bottom:28px;position:relative;overflow:hidden}
.bay .dn{color:#fff}
.bay.warn{background:#5A2A2E}.bay.warn .bc{color:#FFB3A8}
.bc{font-size:30px;font-weight:900;line-height:1;margin-top:2px}.bc small{color:#9FC2BE;font-size:14px}
.bm{width:10px;flex:1;max-height:180px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;flex-direction:column-reverse;margin:10px 0;overflow:hidden}
.bm div{background:var(--scope);transition:height .6s}
.bay.warn .bm div{background:#FF8A7A}
.bd{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px;justify-content:center}
.bd i{width:9px;height:9px;border-radius:50%;opacity:.9}
.lv2 .bd i{box-shadow:0 0 0 2px rgba(79,214,207,.35),0 0 10px var(--scope)}
.bn{font-size:11px;color:#9FC2BE;margin-top:6px}

/* ===== 工作單（劇中紙本）===== */
.card{width:116px;background:var(--paper);color:var(--pink);border-radius:6px;padding:5px 6px;font-size:11px;position:relative;cursor:default;transition:transform .2s,box-shadow .2s;box-shadow:0 1px 0 var(--paperline),0 6px 14px -10px rgba(19,48,61,.5)}
.card.can{cursor:pointer;box-shadow:0 0 0 2px var(--marker),0 8px 18px -10px rgba(19,48,61,.6)}
.card.can:hover{transform:translateY(-3px)}
.card.sel{box-shadow:0 0 0 3px var(--abyss),0 12px 22px -10px rgba(19,48,61,.7);transform:translateY(-3px)}
.card.dim{opacity:.7}
.card .ch{display:flex;justify-content:space-between;font-size:10px;border-bottom:1px solid var(--paperline);padding-bottom:2px;font-family:var(--serif)}
.card .sz{font-weight:700;font-family:var(--sans)}
.card.size1 .sz{color:#A0601F}.card.size2 .sz{color:#1E7C7A}
.card .ci{display:flex;justify-content:center;margin:3px 0}
.card .ctel{font-size:12px;letter-spacing:-1px;min-height:16px}
.card .lock{font-size:9px;background:var(--abyss);color:var(--scope);padding:1px 4px;letter-spacing:0;border-radius:3px}
.card .cs{display:flex;flex-wrap:wrap;gap:2px;min-height:18px}
.card .mark{position:absolute;top:16px;right:3px;transform:rotate(12deg);border:1.5px solid #B5533C;color:#B5533C;font-weight:700;font-size:10px;padding:0 3px;border-radius:3px;background:rgba(251,248,240,.9);font-family:var(--serif)}
.map.lv2 .card.size2{box-shadow:0 0 0 2px var(--scope),0 0 22px -2px rgba(79,214,207,.85)}
.map.lv1 .card.size1{box-shadow:0 0 0 1.5px #E0A458,0 6px 14px -10px rgba(19,48,61,.5)}
.map.lv1 .card.size1.can,.map.lv2 .card.size2.can{box-shadow:0 0 0 2px var(--marker)}
.card.new{animation:printin .7s cubic-bezier(.2,.8,.2,1)}
.card.crushed{animation:crush .8s ease-out}
.card.moved{animation:slide .55s cubic-bezier(.2,.8,.2,1)}
.card.fined{box-shadow:0 0 0 3px var(--alarm)!important;animation:pulse .8s 2}
.stamp{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--c);color:var(--c);border-radius:50%;font-weight:900;font-family:var(--serif);background:rgba(255,255,255,.55);outline:1px solid var(--c);outline-offset:-4px;flex:none}
.stamp.sq{border-radius:3px}
.stamp.drop{animation:stampdrop .5s ease-out}
.card.crushed .cs .stamp:last-child{animation:stampdrop .5s ease-out}
@keyframes printin{from{transform:translateY(-26px) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes crush{0%{transform:scale(1.12) rotate(-3deg)}40%{transform:scale(.86) rotate(2deg)}100%{transform:none}}
@keyframes slide{from{transform:translateX(-46px);opacity:.25}to{transform:none;opacity:1}}
@keyframes stampdrop{0%{transform:scale(2.4);opacity:0}70%{transform:scale(.9);opacity:1}100%{transform:none}}
@keyframes pulse{50%{filter:brightness(.9)}}
body.camflash::after{content:"";position:fixed;inset:0;background:#fff;opacity:.9;animation:flash .45s forwards;pointer-events:none;z-index:99}
@keyframes flash{to{opacity:0}}

/* ===== 側欄 ===== */
.side{width:310px;overflow-y:auto;padding:14px 14px 14px 4px;display:flex;flex-direction:column;gap:10px;background:var(--tide)}
.box{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.bt{font-weight:900;margin-bottom:6px;font-size:14px}
.co{display:flex;gap:10px;align-items:center;padding:6px;border-radius:12px;transition:background .2s}
.co.cur{background:var(--tide)}
.cn{font-weight:700;font-size:14px}.cn small{font-weight:400}
.cm{font-size:12px;color:var(--muted)}.cm b{color:var(--ink);font-size:14px}.neg{color:var(--alarm)!important}
.ctk span{font-size:10px;background:var(--tide);border-radius:999px;padding:1px 7px;margin-right:3px}
.plant{display:flex;flex-wrap:wrap;gap:5px}
.plant i{width:24px;height:24px;border:1.5px dashed var(--line);border-radius:6px}
.plant i.f{border:1px solid rgba(19,48,61,.25)}
.rf{padding:8px 0;border-top:1px solid var(--tide2)}.rf:first-of-type{border-top:0}
.rf.done .rn::after{content:"　已完工";color:var(--kelp);font-size:12px}
.rn{font-weight:700;font-size:13px}.rd2{font-size:12px;color:var(--muted)}
.pb{position:relative;height:18px;border-radius:999px;background:var(--tide);margin:6px 0;overflow:hidden}
.pb div{height:100%;background:#A9D3BC;transition:width .5s}
.pb span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:18px;font-weight:700;color:var(--ink)}
.ib{font-size:12px;color:var(--muted)}.ib button{padding:2px 11px;margin-left:3px;font-size:12px}
.tk{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--tide2)}.tk:nth-child(2){border-top:0}.tk>div{flex:1}.te{font-size:12px;color:var(--muted);line-height:1.5}
.tk button{padding:5px 12px;font-size:13px}
.log{flex:1;min-height:140px;font-size:12px}
.ll{padding:4px 0;border-bottom:1px solid var(--tide);line-height:1.5}
.ll.sys{color:var(--muted)}.ll.bad{color:var(--alarm)}.ll.good{color:var(--kelp)}.ll.warn{color:#A0601F}

/* ===== 下方行動列 ===== */
.bot{display:flex;gap:16px;align-items:center;padding:12px 18px;background:var(--surface);border-top:1px solid var(--line);min-height:92px}
.me{display:flex;gap:12px;align-items:center;width:330px;flex:none}
.turn{font-size:22px;font-weight:900;color:var(--c)}
.acts{flex:1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted)}
.acts button{border-radius:14px;padding:8px 16px;text-align:left}
.acts .big{border-radius:14px}
.acts .crush{background:#FFF4E5;color:var(--ink);border-color:#F2C98A}.acts .crush:hover:not(:disabled){border-color:#A0601F}
.acts .collect{background:#E6F3F0;color:var(--ink);border-color:#A9CFC6}.acts .collect:hover:not(:disabled){border-color:var(--kelp)}
.acts .end{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink);border-radius:999px;padding:11px 24px;font-weight:700}
.seltext{max-width:400px;font-size:14px;line-height:1.55;padding:6px 12px;background:var(--paper);border-radius:10px;color:var(--pink)}
.seltext b{font-family:var(--serif)}

/* ===== 彈窗 ===== */
.ov{position:fixed;inset:0;background:rgba(14,42,58,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mo{background:var(--surface);border-radius:22px;padding:22px;max-width:780px;width:92%;max-height:92vh;overflow:auto;box-shadow:0 40px 80px -30px rgba(0,0,0,.55);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(18px);opacity:0}}
.mb{text-align:right;margin-top:14px}
.evc .npm{display:inline-block;font-size:15px;border-bottom:2px solid var(--pink);padding-bottom:2px}
.evc p{font-size:16px;line-height:1.7}.eff{font-weight:700;border-top:1px solid var(--line);padding-top:10px;color:var(--abyss)}
.mo.paperm{background:var(--abyss)}
.mo.paperm .mb button{background:#fff;color:var(--abyss);border-color:#fff}
.nph{font-family:var(--serif);font-size:30px;font-weight:900;line-height:1.3;margin:8px 0}.nph.sm{font-size:24px}
.nps{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:8px}
.np{background:var(--paper);color:var(--pink);padding:18px 20px;position:relative;border-radius:4px;box-shadow:0 20px 40px -24px rgba(0,0,0,.5)}
.np .npm{display:block;font-size:24px;text-align:center;border-bottom:3px double var(--pink);padding-bottom:6px}
.npg{display:flex;gap:16px}.npp{width:42%;min-height:160px;background:#E8E0CF;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:12px;color:#7A7262}
.npb{flex:1;font-family:var(--serif);font-size:15px;line-height:1.9;text-align:justify}
.settle{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);color:#fff}
.settle b{color:var(--scope)}
.fr{display:flex;align-items:center;gap:8px;margin-top:6px}.fr b{color:#fff}
.corner{margin-top:12px;text-align:right;font-size:12px;border-top:1px solid var(--paperline);padding-top:6px}

/* ===== 結局 ===== */
.ending{flex:1;overflow:auto;padding:44px max(24px,5vw);display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--tide)}
.ending.dark,.ending.lab{background:var(--abyss);color:#fff}
.ending h2{font-size:clamp(24px,3vw,36px);font-weight:900;text-align:center;margin:0;max-width:22em}
.lead{font-size:17px;color:var(--muted)}.ending.lab .lead{color:#9FC2BE}
.yef{background:var(--surface);border-radius:18px;padding:12px 20px}
.yef .yr{display:flex;align-items:center;gap:10px;font-size:17px;margin:8px 0}
.bins{display:flex;gap:16px;width:100%;max-width:1100px}
.bin{flex:1;border-radius:20px;background:var(--surface);color:var(--ink);min-height:280px;display:flex;flex-direction:column;overflow:hidden}
.bdots{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:16px;align-content:flex-end}
.bdots i{width:18px;height:18px;border-radius:5px;border:1px solid rgba(19,48,61,.3);animation:drop .5s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.bdots i.ghost{border:1.5px dashed var(--line);background:transparent}
.bin:nth-child(3){background:var(--deep);color:#fff}.bin:nth-child(3) .bname{border-color:rgba(255,255,255,.15)}
.bname{border-top:1px solid var(--tide2);padding:12px;font-weight:700;text-align:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid rgba(19,48,61,.3);border-radius:4px;margin-right:5px;vertical-align:-2px}.legend i.ghost{border:1.5px dashed var(--line)}
.shorts{max-width:760px;background:var(--paper);color:var(--pink);padding:18px 26px;border-radius:4px}
.shorts p{font-family:var(--serif);font-size:16px;line-height:1.9;border-bottom:1px solid var(--paperline);padding-bottom:10px}
.shorts p:last-child{border:0}
.pair{display:flex;gap:20px;align-items:flex-start;max-width:1200px;width:100%}.pair .np{flex:1.4}
.poster{flex:1;background:var(--paper);color:var(--pink);padding:22px;text-align:center;border-radius:4px;box-shadow:0 20px 40px -24px rgba(0,0,0,.5)}
.poster.bright{background:#FFF3C4}.poster.red{border-top:8px solid #B5533C;max-width:520px}
.pt1{font-size:22px;font-weight:900;font-family:var(--serif)}.pt2{font-size:18px;margin:12px 0}.pt3{font-size:15px;margin:5px 0}.pt4{font-size:13px;margin-top:12px}
.slogan{font-size:clamp(22px,2.6vw,30px);font-weight:900;margin-top:8px;text-align:center}
.nam{font-size:17px}
.rank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rk{display:flex;gap:10px;align-items:center;border-radius:999px;padding:8px 16px 8px 8px;background:var(--surface);color:var(--ink)}
.rk.win{box-shadow:0 0 0 3px var(--marker)}.rk em{font-style:normal;font-weight:900;color:#A0601F}.rk span{font-size:13px;color:var(--muted)}
.eb{display:flex;gap:10px;margin-top:6px}
.ending.dark .eb button:not(.big){background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.ending.dark .big,.ending.lab .big{background:#fff;color:var(--abyss);border-color:#fff}
.ending.lab .legend{color:#9FC2BE}
@media (max-width:1150px){.side{width:260px}.me{width:250px}.card{width:104px}.scope{width:240px}}

/* ===== Ndemic 式主畫面 ===== */
:root{--bg:#EAD6B4;--pn:#FAF1E2;--pn2:#F1E2C8;--ln:#D2BC98;--tx:#2B3A40;--mu:#6E6352;--amber:#B9862C;--red:#A2412F;--teal:#3F7F6A;--paper:#FAF1E2;--ink:#2B3A40;--stamp:#A2412F;--num:"Oswald","Noto Sans TC",sans-serif}
#app:has(.topbar){background:var(--bg);color:var(--tx)}
.num{font-family:var(--num);font-weight:700;letter-spacing:.01em}
.num.big{font-size:30px;line-height:1}
.topbar{display:flex;align-items:stretch;background:#0B1115;border-bottom:1px solid var(--ln);height:44px;flex:none}
.tick{flex:1;display:flex;min-width:0}
.tkl{background:var(--red);color:#fff;font-family:var(--serif);font-weight:900;letter-spacing:.1em;padding:0 16px;display:flex;align-items:center;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);padding-right:26px}
.tkw{flex:1;overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tkm{display:flex;gap:56px;white-space:nowrap;animation:tick 38s linear infinite;padding-left:20px;font-size:15px;font-weight:500}
.tkm span::before{content:"";display:inline-block;width:6px;height:6px;background:var(--amber);border-radius:50%;margin-right:12px;vertical-align:3px}
@keyframes tick{to{transform:translateX(-50%)}}
.tr{display:flex;align-items:center;gap:10px;padding:0 12px}
.round{display:flex;align-items:baseline;gap:3px}.round b{font-family:var(--num);font-size:26px}.round span{font-size:12px;color:var(--mu)}
.spd{display:flex;gap:3px}.spd button,.ic{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;font-size:13px}
.spd button.on{background:var(--amber);color:#111;border-color:var(--amber)}
.ic{width:32px;height:32px;padding:0;font-weight:900;font-size:16px;border-radius:50%}
.gm{flex:1;display:flex;min-height:0}
.cos{width:210px;flex:none;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--pn);border-right:1px solid var(--ln)}
.chip{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;border-left:3px solid transparent}
.chip.cur{background:var(--pn2);border-left-color:var(--c)}
.chip .stamp{background:#F4EFE3}
.chn{font-weight:700;font-size:13px;color:var(--c)}.chn small{margin-left:5px;color:var(--mu);font-weight:400}
.chv{font-size:12px;color:var(--mu);display:flex;align-items:baseline;gap:3px}.chv .num{font-size:17px;color:var(--tx)}
.sep{width:8px}.neg{color:var(--red)!important}
.cht2{font-size:10px;color:var(--mu);margin-top:1px}
.mapw{flex:1;position:relative;display:flex;gap:0;min-width:0;background:#2A3832;overflow:hidden}
.mapw .riverband{position:absolute;left:0;right:0;bottom:18%;height:90px;width:100%;opacity:.95;z-index:0}
.mapw .riverband path:first-child{fill:#2F6E7A}
.zone{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;border-right:1px dashed rgba(255,255,255,.12);min-width:0}
.zone header{font-weight:900;font-size:15px;padding:10px 12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);letter-spacing:.08em}
.z0{background:rgba(70,88,66,.55)}.z1{background:rgba(92,82,62,.5)}.z2{background:rgba(92,72,66,.5)}.z3{background:rgba(60,82,88,.5)}
.bayz{flex:.75;background:#173E52;border-right:0;z-index:2}
.bayz.warn{background:#4A2328;animation:alarm 1.6s infinite}
@keyframes alarm{50%{background:#5E2830}}
.bubs{flex:1;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding:4px 12px 12px;overflow-y:auto}
.bub{position:relative;width:62px;height:62px;border-radius:50%;padding:0;background:#F4EFE3;border:3px solid #2E3A4F;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.45);cursor:default}
.bub:hover{transform:none}
.bub.s1{border-color:#E0A458}.bub.s2{border-color:#3C8D93;background:#E6F1F0}
.bub .bi{display:flex;transform:translateY(2px)}
.bt2{position:absolute;top:-6px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--amber);color:#111;font-family:var(--num);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.bt2::before{content:"☎";font-size:9px;margin-right:1px;font-family:var(--sans)}
.bs{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.bs i{width:9px;height:9px;border-radius:50%;border:1.5px solid #11181D}
.bub.mute{opacity:.55}
.bub.can{cursor:pointer;animation:bubpulse 1.6s infinite}
.bub.can::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--amber);opacity:.9}
.bub.can:hover{transform:scale(1.08)}
.bub.sel{box-shadow:0 0 0 4px #fff,0 0 22px rgba(255,255,255,.6);animation:none}
@keyframes bubpulse{50%{box-shadow:0 0 0 6px rgba(242,177,52,.25),0 4px 10px rgba(0,0,0,.45)}}
.mapw.lv1 .bub.s1{box-shadow:0 0 0 3px rgba(224,164,88,.5),0 0 16px rgba(224,164,88,.6)}
.mapw.lv2 .bub.s2{box-shadow:0 0 0 3px rgba(70,199,190,.5),0 0 22px rgba(70,199,190,.9);opacity:1}
.bub.new{animation:popin .6s cubic-bezier(.2,1.4,.4,1)}
.bub.crushed{animation:shatter .8s ease-out}
.bub.moved{animation:none}
.bub.fined{box-shadow:0 0 0 4px var(--red),0 0 24px var(--red)!important}
@keyframes popin{from{transform:scale(0)}}
@keyframes shatter{0%{transform:scale(1.25) rotate(-8deg)}40%{transform:scale(.8) rotate(6deg)}100%{transform:none}}
@keyframes drift{from{transform:translateX(-60px);opacity:.2}}
.bayd{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-end;padding:12px}
.bayd i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.4);animation:popin .5s}
.mapw.lv2 .bayd i{box-shadow:0 0 10px var(--teal)}
.panel{width:330px;flex:none;background:var(--pn);border-left:1px solid var(--ln);padding:16px;overflow-y:auto}
.gh{font-size:22px;font-weight:900;margin-bottom:10px}
.gp{color:var(--mu);font-size:14px;line-height:1.7}
.gs{list-style:none;padding:0;margin:0;counter-reset:s}
.gs li{counter-increment:s;position:relative;padding:8px 0 10px 34px;border-bottom:1px solid var(--ln);color:var(--mu)}
.gs li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:13px}
.gs li b{display:block;color:var(--tx);font-size:14px}.gs li span{font-size:12px;line-height:1.6}
.gs li.now::before{background:var(--amber);color:#111;border-color:var(--amber)}
.gs li.done{opacity:.5}.gs li.done::before{content:"✓";background:var(--teal);color:#111;border-color:var(--teal)}
.tip{margin-top:10px;font-size:13px;line-height:1.6;background:rgba(242,177,52,.12);border-left:3px solid var(--amber);padding:8px 10px;border-radius:0 8px 8px 0}
.pcard .card{width:100%;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.pcard .card .ct{font-size:14px}.pcard .card .cl{font-size:12px}
.pa{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.act{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border-radius:12px;padding:10px 14px;border:0;color:#111}
.act b{font-size:17px}.act span{font-family:var(--num);font-size:16px;font-weight:700}.act em{grid-column:1/-1;font-style:normal;font-size:12px;opacity:.75}
.act.crush{background:var(--amber)}.act.collect{background:var(--teal)}
.act:disabled{background:var(--pn2);color:var(--mu);opacity:1}
.ghost{background:transparent;color:var(--mu);border:1px solid var(--ln)}
.hud{flex:none;display:flex;align-items:stretch;gap:0;background:#0B1115;border-top:1px solid var(--ln);min-height:86px}
.hud>div{padding:10px 14px;border-right:1px solid var(--ln);display:flex;flex-direction:column;justify-content:center}
.hme{flex-direction:row!important;align-items:center;gap:10px;width:230px;border-left:4px solid var(--c)}
.hme .stamp{background:#F4EFE3}
.hn{font-weight:900;color:var(--c);font-size:15px}.hm{display:flex;align-items:baseline;gap:4px;color:var(--mu);font-size:13px}.hm .num{color:var(--tx);font-size:18px}.hm .num.big{font-size:32px}
.gauge{width:230px}
.gl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);font-weight:700;letter-spacing:.06em}
.gl .num{font-size:18px;color:var(--tx)}.gl small{font-size:12px;color:var(--mu)}
.lvs{display:flex;gap:4px}.lvs i{width:22px;height:22px;border-radius:50%;background:var(--pn2);color:#566A73;display:flex;align-items:center;justify-content:center}.lvs i svg{width:14px;height:14px}
.lvs i.on{background:var(--teal);color:#0B1115}
.bar{position:relative;height:10px;background:var(--pn2);border-radius:5px;margin:7px 0 5px;overflow:hidden}
.bar>div{height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.inv .bar>div{background:linear-gradient(90deg,#2E8F88,var(--teal))}
.bar em{position:absolute;top:0;bottom:0;width:2px;background:#0B1115}
.bayg .bar>div{background:linear-gradient(90deg,#B4423A,var(--red))}
.bayg.warn .gl span:first-child{color:var(--red)}
.gs2{font-size:11px;color:var(--mu)}
.plg{width:170px}.pboxes{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}.pboxes i{width:15px;height:15px;border:1.5px dashed #3D4F5A;border-radius:3px}.pboxes i.f{border:1px solid rgba(0,0,0,.4)}
.hb{flex-direction:row!important;align-items:center;gap:6px}
.hb button,.ha button{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;text-align:center}
.hb button small,.ha button small{color:var(--mu);font-size:11px}
.hb button:hover:not(:disabled),.ha button:hover:not(:disabled){border-color:var(--amber)}
.ha{flex:1;flex-direction:row!important;align-items:center;gap:8px;justify-content:flex-end;border-right:0!important}
.ha .endb{background:var(--amber);color:#111;border-color:var(--amber);font-weight:900;font-size:16px;padding:12px 22px}
.ha .endb:disabled{background:var(--pn2);color:var(--mu);border-color:var(--ln);opacity:1}
/* sheet */
.sheetov{position:fixed;inset:0;background:rgba(5,10,14,.6);z-index:48;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.sheet{width:min(620px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ln)}.sheet h3{margin:0;font-size:20px}
.sbody{padding:14px 18px;overflow-y:auto}
.srow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.srow>div:first-child{flex:1}
.srow.col{flex-direction:column;align-items:stretch}
.srow b{font-size:16px}.srow small{margin-left:8px;color:var(--mu)}.srow small.ok{color:var(--teal)}.srow p{margin:4px 0;color:var(--mu);font-size:14px}.srow em{font-size:12px;color:#6F848E}
.pri{background:var(--amber);color:#111;border-color:var(--amber);font-weight:900}
.sheet .pri:disabled{background:var(--pn2);color:var(--mu);border-color:var(--ln)}
.rb{height:18px}.rb>div{background:linear-gradient(90deg,#3F7A5A,#6DBA8C)}.rb span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:18px;font-weight:700}
.inv2{display:flex;gap:12px;font-size:12px}
.ib2{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu)}.ib2 button{background:var(--pn2);color:var(--tx);border-color:var(--ln)}.ib2 button:hover{border-color:var(--amber)}
.logl .ll{border-bottom:1px solid var(--ln)}.logl .ll.sys{color:var(--mu)}
.help h4{margin:14px 0 4px;color:var(--amber)}.help p,.help li{font-size:14px;line-height:1.75;color:#C9D6DB}.help ul{padding-left:18px;margin:0}
.sb2{margin-top:14px}.sb2 button{background:var(--pn2);color:var(--tx);border-color:var(--ln)}
/* tour */
.tour{position:fixed;inset:0;z-index:60;pointer-events:none}
.tourhole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(5,10,14,.72);outline:2px solid var(--amber);transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tourbox{position:fixed;width:340px;background:#F7F3E8;color:#13303D;border-radius:16px;padding:16px 18px;pointer-events:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:left .35s,top .35s}
.tourbox h4{margin:4px 0 6px;font-size:18px}.tourbox p{margin:0;font-size:14px;line-height:1.7}
.tn{font-family:var(--num);font-size:12px;color:#8A7F68}
.tb3{display:flex;justify-content:space-between;margin-top:12px}.tb3 .ghost{color:#6B6455;border-color:#D8CFBD}
/* 事件與報紙彈窗：深色 */
.ov{background:rgba(5,10,14,.7)}
.mo{background:var(--pn,#1A242B);color:#E4ECEF;border:1px solid #2F3F4A}
.mo .evc .npm{color:#E4ECEF;border-color:#E4ECEF}
.mo .eff{color:#F2B134;border-color:#2F3F4A}
.mo .mb button{background:#F2B134;color:#111;border-color:#F2B134}
/* 設定與結局改深色 */
.setup{background:var(--bg);color:var(--tx)}.setup .sublead,.setup .lab{color:var(--mu)}
.setup .seat{background:var(--pn);box-shadow:none;border:1px solid var(--ln);border-top:6px solid var(--c)}
.setup .sm{color:var(--tx)}.setup .sw,.setup .sh{color:var(--mu)}
.setup button:not(.cob){background:var(--pn2);color:var(--tx);border-color:var(--ln)}
.setup button.on:not(.cob){background:var(--amber);color:#111;border-color:var(--amber)}
.setup .pill.pri{background:var(--amber);color:#111;border-color:var(--amber)}
.setup #seed{background:var(--pn2);color:var(--tx);border-color:var(--ln)}
.cob{background:transparent}
.ending{background:var(--bg);color:var(--tx)}.ending .lead{color:var(--mu)}
.ending .yef,.ending .rk{background:var(--pn);color:var(--tx)}.ending .rk span{color:var(--mu)}.ending .rk em{color:var(--amber)}
.ending .big,.ending .pill.pri{background:var(--amber);color:#111;border-color:var(--amber)}
.ending .eb button:not(.big){background:transparent;color:var(--tx);border-color:var(--ln)}
.title .pill.pri{background:var(--amber);border-color:var(--amber);color:#111}
@media (max-width:1250px){.cos{width:170px}.panel{width:280px}.gauge{width:180px}.hme{width:190px}.plg{width:130px}}
@media (prefers-reduced-motion:reduce){.tkm,.bub.can,.bayz.warn{animation:none}}

/* ===== 特效 ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}
.lenshero{flex:1;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#1B4A5E 0%,#0E2A3A 55%,#0A1F2B 100%);cursor:none}
.lenshero canvas{position:absolute;inset:0}
.lenshero button{cursor:pointer}
.lt{position:relative;z-index:2;text-align:center;padding-top:7vh;pointer-events:none}
.lt .tb2{pointer-events:auto}
.lt h1{font-size:clamp(46px,8vw,112px);font-weight:900;margin:0;letter-spacing:.04em;line-height:1.02;background:linear-gradient(180deg,#FFFFFF 30%,#9FD9D3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(79,214,207,.25))}
.lhint{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:2;color:#BFE7E2;font-size:15px;letter-spacing:.1em;pointer-events:none;animation:hint 2.4s ease-in-out infinite;transition:opacity .6s}
.lhint.gone{opacity:0}
@keyframes hint{50%{opacity:.45}}
.lc{position:absolute;left:28px;bottom:26px;z-index:2;color:#9FC2BE;font-size:14px;pointer-events:none}
.lc b{font-family:var(--num);font-size:34px;color:#4FD6CF;margin:0 4px;font-weight:700;vertical-align:-4px}
.lenshero .blurb{margin:18px auto 0;max-width:30em;font-size:14px}
.scanfx{position:fixed;inset:0;z-index:55;pointer-events:none;display:flex;align-items:center;justify-content:center}
.sc-lens{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(14,42,58,.2) 0,rgba(10,22,30,.92) 60%);clip-path:circle(0% at 50% 50%);animation:lensopen .7s cubic-bezier(.2,.8,.2,1) forwards}
.sc-lens::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(79,214,207,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(79,214,207,.12) 1px,transparent 1px);background-size:44px 44px}
@keyframes lensopen{to{clip-path:circle(75% at 50% 50%)}}
.sc-line{position:absolute;left:0;right:0;height:3px;background:#4FD6CF;box-shadow:0 0 24px 6px rgba(79,214,207,.7);top:0;animation:scan 1.4s .25s cubic-bezier(.5,0,.5,1) forwards;opacity:0}
@keyframes scan{0%{top:0;opacity:1}100%{top:100%;opacity:1}}
.sc-t{position:relative;text-align:center;color:#fff;animation:sct .6s .35s backwards cubic-bezier(.2,.8,.2,1)}
.sc-t small{display:block;font-size:16px;letter-spacing:.3em;color:#9FD9D3}

/* ===================== 標題畫面（v0.7）：左邊主視覺、右邊一張公文 ===================== */
.tl{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(400px,1fr);min-height:100%;background:#EAD6B4 url(img/desk_wood.webp) center/cover;color:#2B3A40}
.tl-art{margin:0;position:relative;overflow:hidden;min-height:100%}
.tl-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 58%}
.tl-art::after{content:"";position:absolute;inset:0 0 0 auto;width:60px;background:linear-gradient(90deg,transparent,rgba(60,35,10,.28))}
.tl-desk{display:flex;align-items:center;justify-content:center;padding:4vh 3vw}
.tl-doc{width:100%;max-width:440px;background:#FFFBF2;border:1px solid #CDB693;border-radius:2px;padding:30px 34px 22px;box-shadow:0 1px 0 #fff,0 26px 40px -22px rgba(60,35,10,.65);transform:rotate(.6deg);animation:tlIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes tlIn{from{opacity:0}}
.tl-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.18em;color:#6E6352;border-bottom:3px double #2B3A40;padding-bottom:9px}
.tl h1{font-family:var(--serif);font-weight:900;font-size:clamp(52px,5.4vw,84px);line-height:1.04;letter-spacing:.02em;margin:22px 0 10px;color:#2B3A40}
.tl-tag{font-family:var(--serif);font-weight:700;font-size:21px;color:#A2412F;margin:0 0 14px}
.tl-lede{font-size:14.5px;line-height:1.85;color:#4B5257;margin:0 0 22px}
.tl-start{display:flex;align-items:center;gap:14px;width:100%;background:#FFF9EE;border:2px solid #A2412F;border-radius:3px;color:#A2412F;font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:.2em;padding:8px 22px 8px 12px;box-shadow:3px 3px 0 rgba(162,65,47,.25);cursor:pointer}
.tl-start img{height:58px;width:auto;transition:transform .2s cubic-bezier(.5,0,.75,.4)}
.tl-start:hover{background:#FFF2E2}.tl-start:hover img{transform:translateY(-4px) rotate(-6deg)}
.tl-start:active img{transform:translateY(6px) scale(.95)}
.tl-links{display:flex;flex-direction:column;margin:16px 0 18px}
.tl-links button{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;background:transparent;border:0;border-bottom:1px dashed #CDB693;border-radius:0;padding:13px 2px;text-align:left;color:#2B3A40;cursor:pointer}

.tl-facts{display:flex;flex-wrap:wrap;gap:4px 0;font-size:12px;color:#6E6352;border-top:1px solid #2B3A40;padding-top:10px}

@media (max-width:860px){.tl{grid-template-columns:1fr}.tl-art{height:44dvh;min-height:240px}.tl-desk{padding:0 16px 28px}.tl-doc{margin-top:-40px;position:relative;transform:none;padding:22px 20px 18px}.tl h1{font-size:44px}.tl h1 br{display:none}.tl-lede br{display:none}}

/* =====================================================================
   v1.0 設計系統（老闆的辦公桌）
   字級 5 級：大標 34/24・標題 22/18・內文 16/15・標籤 13/12・數字
   按鈕 4 種：印章（主要）、紙標籤（次要）、分頁夾（切換）、抽屜（收納）
   ===================================================================== */
:root{--paper:#FFF8EA;--ink2:#2B3A40;--seal:#B23A2A;--harbor:#2E5E7E;--keep:#3E7E6A;--smash:#D2873C;--wood:#A87842;--mute2:#6E6352}
.ic-img{width:22px;height:22px;object-fit:contain;flex:none;vertical-align:middle}
.ic-img.sm{width:16px;height:16px}

/* ---- 印章鈕（主要） ---- */
.b-stamp,#app button.big,#app .pill.pri:not(.cover-start),#app .intro .intro-continue,.tour .tb3 .pri,.sheetov button.big,.ov button.big{
  display:inline-flex!important;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:8px 26px 8px 18px!important;
  background:var(--paper) url(img/ui_stamp_frame.png) center/100% 100% no-repeat!important;border:0!important;border-radius:4px!important;
  color:var(--seal)!important;font:900 19px/1.1 var(--serif)!important;letter-spacing:.08em;cursor:pointer;
  box-shadow:0 3px 0 rgba(120,40,20,.18),0 6px 14px -6px rgba(60,35,10,.4)!important;transition:transform .12s,box-shadow .12s}
#app button.big::before,#app .pill.pri:not(.cover-start)::before,#app .intro .intro-continue::before,.tour .tb3 .pri::before,.ov button.big::before,.sheetov button.big::before{
  content:"";width:22px;height:28px;flex:none;background:url(img/ui_stamp_handle.png) center/contain no-repeat;transition:transform .12s}
.b-stamp .b-hd{width:24px;height:30px;object-fit:contain;flex:none;transition:transform .12s}
.b-stamp:hover:not(:disabled),#app button.big:hover:not(:disabled),#app .pill.pri:not(.cover-start):hover,.ov button.big:hover,.tour .tb3 .pri:hover{transform:translateY(-1px);background-color:#FFFDF6!important;color:var(--seal)!important}
.b-stamp:active:not(:disabled),#app button.big:active:not(:disabled),#app .pill.pri:not(.cover-start):active,.ov button.big:active,.tour .tb3 .pri:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0)!important}
.b-stamp:active .b-hd,#app button.big:active::before,.ov button.big:active::before{transform:translateY(5px)}
.b-stamp:disabled,#app button.big:disabled{opacity:.42;filter:grayscale(.8);cursor:not-allowed;transform:none}
.b-stamp.pressing .b-hd{transform:translateY(6px)}

/* ---- 紙標籤（次要） ---- */
.b-tag,#app .pill:not(.pri),#app .intro .skip,#app .ye-skip,#app .ye-det,.tour .tb3 .ghost{
  display:inline-flex!important;align-items:center;gap:6px;min-height:42px;padding:4px 18px 4px 30px!important;
  background:url(img/ui_tag.png) center/100% 100% no-repeat!important;border:0!important;border-radius:0!important;box-shadow:none!important;
  color:var(--ink2)!important;font:700 14px/1.2 var(--sans)!important;transform-origin:14px 50%;transition:transform .15s;cursor:pointer;white-space:nowrap}
.b-tag:hover:not(:disabled),#app .pill:not(.pri):hover,#app .intro .skip:hover,.tour .tb3 .ghost:hover{transform:rotate(-2.5deg)}
.b-tag small{font:500 12px var(--sans);color:var(--mute2);margin-left:2px}
.b-tag:disabled{opacity:.42;cursor:not-allowed;transform:none}

/* ---- 分頁夾（切換） ---- */
.rs-role,.rs-style,.rs-foot .row,.setup-advanced .row{gap:4px!important}
#app .rs-role{border:0!important;background:none!important;display:flex;align-items:flex-end;border-bottom:2px solid #8A6A3A!important;padding:0 4px}
#app .rs-role button,#app .rs-style button,#app .rs-foot .row button,#app .setup-advanced .row button{
  flex:1;min-height:42px;padding:8px 10px!important;border:1px solid #B79C70!important;border-bottom:0!important;border-radius:9px 9px 0 0!important;
  background:#F1E4C8!important;color:var(--mute2)!important;font:700 14px var(--sans)!important;transform:translateY(3px);transition:transform .15s;box-shadow:none!important}
#app .rs-role button+button{border-left:1px solid #B79C70!important}
#app .rs-role button.on,#app .rs-style button.on,#app .rs-foot .row button.on,#app .setup-advanced .row button.on{background:#D8B98A!important;color:var(--ink2)!important;transform:none;border-color:#8A6A3A!important}
#app .rs-style{border-bottom:1px solid #C9B28C;padding:0 4px}#app .rs-style button{flex:0 1 auto;min-height:34px;font-size:13px!important}
#app .rs-foot .row,#app .setup-advanced .row{align-items:flex-end;border-bottom:2px solid #8A6A3A;padding-bottom:0}
#app .rs-foot .row button,#app .setup-advanced .row button{flex:0 0 auto}

   ===================================================================== */

/* ---- 三欄：軟木板｜地圖｜夾板 ---- */
#app.screen-game .gm{grid-template-columns:186px minmax(0,1fr) 352px!important;grid-template-rows:minmax(0,1fr)!important}
#app.screen-game .gm>.cos{grid-column:1!important;grid-row:1!important;flex-direction:column!important;align-items:stretch!important;justify-content:flex-start;gap:12px!important;padding:16px 12px!important;
  background:#C48A5A url(img/board_cork.webp) center/100% 100% no-repeat!important;border:0!important;box-shadow:inset -6px 0 10px -6px rgba(40,20,10,.4)!important;overflow-y:auto;overflow-x:visible}
#app .gm>.cos .chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 8px 8px!important;background:#FFFDF6!important;border:0!important;border-radius:2px!important;
  box-shadow:0 4px 8px rgba(40,20,10,.35)!important;transform:rotate(-1.5deg);transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;flex:none!important}

#app .gm>.cos .chip.cur{transform:rotate(0) scale(1.06) translateY(-2px);box-shadow:0 0 0 3px var(--c),0 10px 18px rgba(40,20,10,.45)!important;z-index:1}

#app .gm>.cos .pol .polimg{position:absolute;inset:6% 0 0;width:100%;height:94%;object-fit:contain;object-position:bottom}
#app .gm>.cos .pol .stamp{position:absolute!important;right:3px;bottom:3px;opacity:.95}
#app .gm>.cos .chip:not(.cur) .pol{filter:saturate(.75) brightness(.97)}
#app .gm>.cos .cht{width:100%;text-align:center}
#app .gm>.cos .chn{font:900 14px/1.3 var(--serif)!important;color:var(--ink2)!important;justify-content:center;display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}

#app .gm>.cos .chv{justify-content:center;font-size:12px!important;color:var(--mute2)!important;display:flex;align-items:center;gap:3px}

#app .gm>.cos .cht2{font-size:11px!important;color:var(--mute2)!important}

#app.screen-game .gm>.panel{grid-column:3!important;grid-row:1!important;width:auto!important}

/* ---- 決定卡 ---- */
.decide{position:absolute;z-index:20;--cw:220px;opacity:0;pointer-events:none}
.decide.placed{opacity:1;pointer-events:auto;animation:dcin .35s cubic-bezier(.3,1.3,.5,1) both}
@keyframes dcin{from{opacity:0;transform:translateY(18px) scale(.96)}}

.dc-cards{display:grid;grid-template-columns:repeat(2,var(--cw));gap:14px}
.dc{position:relative;background:var(--paper);border-radius:8px;box-shadow:0 10px 26px rgba(20,20,30,.45),0 0 0 1px #D9C49B;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;outline:none}
.dc:nth-child(2){animation-delay:80ms}

.dc-gain{display:flex;align-items:baseline;gap:3px;color:var(--ink2)}.dc-gain b{font:900 40px/1 var(--num)}.dc-gain i{font:700 15px var(--sans);font-style:normal}
.dc-how,.dc-bonus,.dc-fine{font:500 12px/1.5 var(--sans);color:var(--mute2)}.dc-bonus{color:var(--keep);font-weight:700}.dc-fine{color:var(--seal);font-weight:700}
.dc .cq{display:grid;gap:4px;margin:4px 0 6px;font-style:normal}
.dc .cq i{font:500 13px/1.45 var(--sans);font-style:normal;color:#3E3428;padding-left:16px;position:relative}

/* ---- 工作單吊牌 ---- */
#app .board .bub{border-radius:4px!important;background:#FFFDF6!important;clip-path:polygon(18% 0,82% 0,100% 14%,100% 100%,0 100%,0 14%);border:0!important;padding:8px 4px 4px!important;overflow:visible}

#app .desk .hm{display:flex;align-items:baseline;gap:4px;font:700 13px var(--sans);color:#4A3A28}#app .desk .hm i{font-style:normal}

#app .desk .lvs .ic-img{width:20px;height:20px}
#app .desk .gs2{font:600 12px var(--sans)!important;color:#4A3A28!important}
#app .desk .bar{height:8px}

.drawer-pop button:hover{background:#F6E2B6!important}.drawer-pop .ic-img{width:30px;height:30px}.drawer-pop small{margin-left:auto;font:600 12px var(--sans);color:var(--mute2)}

<body>
<div id="app"></div>
<script>
// ===== 貝洛港清潔公司 規則引擎 v0.6（純邏輯，不碰 DOM）=====
const CONFIG = {
  rounds: 7, startMoney: 3,
  byPlayers: {
    2: { print: 4, plantCap: 3, bayCap: 13, thr: [5, 9], reformCost: 4, pool: 16, neutral: true },
    3: { print: 4, plantCap: 5, bayCap: 10, thr: [6, 10], reformCost: 6, pool: 24, neutral: false },
    4: { print: 5, plantCap: 6, bayCap: 12, thr: [6, 11], reformCost: 6, pool: 24, neutral: false },
  },
  deck: {
    2: { bottle: [2,3,3,4,4,4], market: [2,3,3,4,4,4], delivery: [2,3,3,4,4], workshop: [2,3,4,4], pellet: 4 },
    3: { bottle: [2,3,3,3,4,4,4], market: [2,3,3,3,4,4,4], delivery: [2,3,3,3,4,4], workshop: [2,3,3,4,4], pellet: 5 },
    4: { bottle: [2,3,3,3,3,4,4,4], market: [2,3,3,3,3,4,4,4], delivery: [2,3,3,3,3,4,4,4], workshop: [2,3,3,3,4,4], pellet: 6 },
  },
  catDistrict: { bottle: 3, market: 1, delivery: 0, workshop: 2, pellet: 2 },
  catBorn: { bottle: 0, market: 0, delivery: 0, workshop: 0, pellet: 1 },
  telFrag: [1, 2, 2], telMicro: [0, 0, 4],
  bigMax: 5,
  events: [['storm',0],['storm',1],['storm',2],['tide',0],['letter',0],['calm',0],['calm',1]],
  tech: { crush2: 2, expand: 3, cofund: 2 },
  projects: ['bottle', 'market'],
  investMax: 4,
  fineUp: 1, fineYE: 1,   // 每張賠幾萬：報社升級時／年終總檢查
  // v0.6 市府本月重點：每輪（一個月）翻一張，只在那個月有效
  useGoals: true,
  goals: ['perf', 'green', 'match', 'port', 'audit', 'river', 'routine'],
};
const SIZE = ['big', 'frag', 'micro'];
const RIVER = [0, 1, 2, 3];

function mulberry(seed) {
  let a = seed >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function newStats() { return { crush: 0, crush2: 0, collect: 0, caught: 0, bitten: 0, leak: 0, odd: 0, invested: 0, yeFound: 0, income: 0, paid: 0, bonus: 0 }; }

function createGame(seats, seed) {
  const P = seats.length, pc = CONFIG.byPlayers[P], rnd = mulberry(seed);
  const deck = []; let textIdx = {};
  for (const [cat, spec] of Object.entries(CONFIG.deck[P])) {
    const tels = Array.isArray(spec) ? spec : Array(spec).fill(0);
    tels.forEach((t, i) => deck.push({ cat, tel: t, size: CONFIG.catBorn[cat], loc: 'deck', stamps: [], path: [], textIndex: i, id: 0, round: 0 }));
  }
  shuffle(deck, rnd);
  const g = {
    seed, P, pc, rnd, round: 0, deck, cards: [], nextId: 1,
    players: seats.map(s => ({ ...s, money: CONFIG.startMoney, techs: [], invested: { bottle: 0, market: 0 }, stats: newStats() })),
    plantCap: pc.plantCap, overflowN: 1, track: 0, level: 0,
    market: ['crush2', 'expand', 'cofund'],
    reforms: { bottle: { funded: 0, cost: pc.reformCost, first: null, done: false }, market: { funded: 0, cost: pc.reformCost, first: null, done: false } },
    events: shuffle(CONFIG.events.slice(), rnd),
    goals: shuffle(CONFIG.goals.slice(), rnd),
    startPlayer: Math.floor(rnd() * P), order: [], turnIdx: 0, aiTune: null,
    crushesThisRound: 0, boughtThisTurn: false, mainDone: false,
    collapsed: false, over: false, log: [], removedCount: 0, removedCats: [], lastBayCard: null, warned: {},
  };
  g.players.forEach(pl => { pl.nerve = rnd(); });
  return g;
}

const onRiver = c => typeof c.loc === 'number';
function tel(g, c) {
  if (!onRiver(c)) return 0;
  if (c.size === 0) return c.tel;
  if (c.size === 1) return CONFIG.telFrag[g.level];
  return CONFIG.telMicro[g.level];
}
const plant = g => g.cards.filter(c => c.loc === 'plant');
const bay = g => g.cards.filter(c => c.loc === 'bay');
function stampsOf(g, p) { let n = 0; for (const c of g.cards) for (const s of c.stamps) if (s === p) n++; return n; }
function setLoc(c, loc) { c.loc = loc; c.path.push(loc); }
// 這張單的經過：每一步記下發生在第幾輪（r=0 代表年終總檢查）
function hist(g, c, o) { (c.hist || (c.hist = [])).push({ r: g.round, ...o }); }

// ---------- 輪開始 ----------
function startRound(g) {
  g.round++; g.crushesThisRound = 0; const ev = [];
  for (const c of g.cards) if (c.size === 0 && onRiver(c) && c.tel < CONFIG.bigMax) { c.tel++; hist(g, c, { k: 'tel', n: c.tel }); ev.push({ type: 'telUp', id: c.id }); }
  const n = g.pc.print; const printed = [];
  for (let i = 0; i < n && g.deck.length; i++) {
    const c = g.deck.pop(); c.id = g.nextId++; c.round = g.round; setLoc(c, CONFIG.catDistrict[c.cat]); hist(g, c, { k: 'print', loc: c.loc, n: c.tel, size: c.size }); g.cards.push(c); printed.push(c.id);
  }
  ev.unshift({ type: 'printed', ids: printed });
  g.order = []; for (let i = 0; i < g.P; i++) g.order.push((g.startPlayer + i) % g.P);
  g.turnIdx = 0; g.boughtThisTurn = false; g.mainDone = false;
  return ev;
}
const currentPlayer = g => g.order[g.turnIdx];

// ---------- 合法行動 ----------
function canCrush(g, p, c) { return onRiver(c) && tel(g, c) >= 1 && (c.size === 0 || (c.size === 1 && g.players[p].techs.includes('crush2'))); }
function canCollect(g, p, c) { return onRiver(c) && tel(g, c) >= 1 && c.size <= 1 && plant(g).length < g.plantCap; }
function reformRemaining(g, k) { const r = g.reforms[k]; return r.cost - r.funded; }
function canInvest(g, p, k) { const r = g.reforms[k]; return !r.done && g.players[p].money >= 1; }
function investMax(g, p, k) {
  let rem = reformRemaining(g, k); const r = g.reforms[k];
  if (r.funded === 0 && g.players[p].techs.includes('cofund')) rem -= 2;
  return Math.max(0, Math.min(CONFIG.investMax, g.players[p].money, rem));
}
function canLeak(g, p) { return g.players[p].money >= 1 && g.level < 2; }
function canBuy(g, p, t) { return !g.boughtThisTurn && g.market.includes(t) && g.players[p].money >= CONFIG.tech[t]; }
// 本月重點（沒開就是 routine）
function goal(g) { return CONFIG.useGoals && g.goals ? g.goals[(Math.max(1, g.round) - 1) % g.goals.length] : 'routine'; }
function goalBonus(g, c, type) {
  const k = goal(g);
  if (k === 'perf' && type === 'crush') return 1;
  if (k === 'green' && type === 'collect') return 1;
  if (k === 'port' && c.loc === 3) return 1;
  if (k === 'river' && type === 'collect' && c.size === 1) return 2;
  return 0;
}
function crushPreview(g, p, c) { const ns = c.size + 1; return { gain: tel(g, c) + goalBonus(g, c, 'crush'), fine: g.level >= ns || goal(g) === 'audit' ? CONFIG.fineUp : 0 }; }
// v0.5：收走只領一半（進位）。另一半是處理場的進場費。
function collectGain(g, c) { return Math.max(1, Math.ceil(tel(g, c) / 2)) + goalBonus(g, c, 'collect'); }

// ---------- 執行行動 ----------
function act(g, p, a) {
  const pl = g.players[p], ev = [];
  if (a.type === 'buy') {
    const pr = CONFIG.tech[a.tech]; pl.money -= pr; pl.techs.push(a.tech); g.market = g.market.filter(t => t !== a.tech); g.boughtThisTurn = true;
    if (a.tech === 'expand') { g.plantCap += 3; g.overflowN = 2; }
    ev.push({ type: 'buy', p, tech: a.tech, price: pr }); return ev;
  }
  if (g.mainDone) throw new Error('main action already done');
  g.mainDone = true;
  if (a.type === 'crush') {
    const c = g.cards.find(x => x.id === a.id); const { gain, fine } = crushPreview(g, p, c);
    const from = c.size; c.size++; c.stamps.push(p); pl.money += gain; pl.stats.income += gain; pl.stats.crush++; if (from === 1) pl.stats.crush2++;
    g.crushesThisRound++; hist(g, c, { k: 'crush', p, to: c.size, gain });
    ev.push({ type: 'crush', p, id: c.id, from, to: c.size, gain, others: c.stamps.some(s => s !== p) });
    if (fine) { hist(g, c, { k: 'caught', p, fine }); pl.money -= fine; pl.stats.paid += fine; pl.stats.caught++; ev.push({ type: 'caught', p, id: c.id, fine }); }
  } else if (a.type === 'collect') {
    const c = g.cards.find(x => x.id === a.id); const gain = collectGain(g, c);
    c.stamps.push(p); setLoc(c, 'plant'); hist(g, c, { k: 'collect', p, gain }); c.plantSeq = g.plantSeq = (g.plantSeq || 0) + 1; pl.money += gain; pl.stats.income += gain; pl.stats.collect++;
    ev.push({ type: 'collect', p, id: c.id, gain, plantLeft: g.plantCap - plant(g).length });
  } else if (a.type === 'invest') {
    const k = a.project, r = g.reforms[k];
    if (r.funded === 0) { r.first = p; if (pl.techs.includes('cofund')) r.cost -= 2; }
    const amt = Math.max(1, Math.min(a.amount, investMax(g, p, k) || 1, pl.money, r.cost - r.funded));
    const match = goal(g) === 'match' ? Math.min(Math.floor(amt / 2), r.cost - r.funded - amt) : 0;   // 加碼月：每出 2 萬，市府補 1 萬（獎金仍按自己出的錢算）
    pl.money -= amt; pl.invested[k] += amt; pl.stats.invested += amt; r.funded += amt + Math.max(0, match);
    ev.push({ type: 'invest', p, project: k, amount: amt, match: Math.max(0, match), funded: r.funded, cost: r.cost, first: pl.invested[k] === amt && r.funded === amt + Math.max(0, match) });
    if (r.funded >= r.cost) {
      r.done = true; const before = g.deck.length; g.deck = g.deck.filter(c => c.cat !== k); const n = before - g.deck.length;
      g.removedCount += n; g.removedCats.push(k); ev.push({ type: 'reformDone', project: k, removed: n });
      if (g.reforms.bottle.done && g.reforms.market.done) ev.push({ type: 'bothDone' });
    }
  } else if (a.type === 'leak') {
    pl.money -= 1; pl.stats.leak++; g.track++; ev.push({ type: 'leak', p, track: g.track });
  } else if (a.type === 'odd') {
    pl.money += 1; pl.stats.income += 1; pl.stats.odd++; ev.push({ type: 'odd', p });
  }
  return ev;
}

function nextTurn(g) { g.turnIdx++; g.boughtThisTurn = false; g.mainDone = false; return g.turnIdx < g.P; }

// ---------- 輪末 ----------
function toBay(g, c, ev, why) { setLoc(c, 'bay'); hist(g, c, { k: 'bay', why }); g.track++; g.lastBayCard = c.id; ev.push({ type: 'toBay', id: c.id, bay: bay(g).length, cap: g.pc.bayCap }); }

function endRound(g) {
  const ev = [], moved = new Set();
  // 3 中立公司
  if (g.pc.neutral) {
    const bigs = g.cards.filter(c => onRiver(c) && c.size === 0).sort((a, b) => a.tel - b.tel || a.id - b.id);
    if (bigs.length) { const c = bigs[0]; c.size = 1; c.stamps.push('n'); g.crushesThisRound++; hist(g, c, { k: 'crush', p: 'n', to: 1, gain: 0 }); ev.push({ type: 'neutral', id: c.id }); }
  }
  // 4 事件
  const [evt, variant] = g.events[(g.round - 1) % g.events.length];
  ev.push({ type: 'event', event: evt, variant });
  if (evt === 'storm') {
    for (const c of g.cards.filter(c => onRiver(c) && c.size === 1)) {
      moved.add(c.id); const from = c.loc;
      if (c.loc === 3) toBay(g, c, ev, 'rain'); else { setLoc(c, c.loc + 1); hist(g, c, { k: 'move', to: c.loc, why: 'rain' }); ev.push({ type: 'move', id: c.id, from, to: c.loc, reason: 'rain' }); }
    }
    if (plant(g).length >= g.plantCap) {
      const inPlant = plant(g).sort((x, y) => (x.plantSeq || 0) - (y.plantSeq || 0)); const out = [];
      for (let i = 0; i < g.overflowN && inPlant.length; i++) {
        const c = inPlant.pop(); c.size = Math.max(c.size, 1); setLoc(c, 2); hist(g, c, { k: 'overflow', to: 2 }); moved.add(c.id); out.push(c.id);
        for (const s of new Set(c.stamps)) if (s !== 'n') g.players[s].stats.bitten++;
      }
      g.track++; ev.push({ type: 'overflow', ids: out });
    }

  let stuck = 0, gone = 0;
  root.querySelectorAll('.dr-bits circle').forEach((el, i) => {
    const d = ds[i], x0 = 108 + rnd() * 144, jit = rnd();
    const thr = d.mm >= SV_GAP ? 2 : 0.08 + 0.8 * (Math.log10(d.mm) - Math.log10(0.5)) / (Math.log10(SV_GAP) - Math.log10(0.5));
    let x = x0, y = 66 - svR(d.mm) * 0.6;
    if (r > thr) { const k = Math.min(1, (r - thr) / 0.35); x = x0 + k * (360 - x0) * (0.4 + 0.6 * jit); y = 66 + Math.min(1, k * 3) * (44 + jit * 12); gone++; } else stuck++;
    el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    el.style.opacity = x > 352 ? 0 : 1;
  });
  root.querySelectorAll('.rn line').forEach(l => l.style.opacity = +l.dataset.k < r * 36 ? 1 : 0);
  const res = root.querySelector('#sv-rain-res');
  if (res) res.innerHTML = r === 0 ? '還沒下雨。所有碎片都還在路面上。' : `卡在格柵 <b>${stuck}</b> 件・流進下水道 <b>${gone}</b> 件${r >= 0.95 ? '<br>流走的，幾乎都是最小的那些。卡住的，掃得起來。' : ''}`;
}
function svTime(root) {

}

const zmMix = (a, b, t) => '#' + [0, 2, 4].map(i => Math.round(parseInt(a.substr(i + 1, 2), 16) * (1 - t) + parseInt(b.substr(i + 1, 2), 16) * t).toString(16).padStart(2, '0')).join('');
const ZM_BG = ['#EAD8B6', '#E9E4C8', '#E6E3CF', '#E0E8DA', '#DCE7DD', '#D6E3DD'];
function svZoomUpdate(root) {
  const z = SV.zoom, W = ZM.W0 / Math.pow(10, z);
  root.querySelectorAll('.zl').forEach(g => {
    const k = +g.dataset.k, s = Math.pow(10, z - k);
    // 太小（還沒輪到它）或太大（已經放過頭）就淡掉
    const fin = k === 0 ? 1 : Math.max(0, Math.min(1, (z - (k - 0.8)) / 0.4)), fout = k === ZM.N - 1 ? 1 : Math.max(0, Math.min(1, ((k + 0.72) - z) / 0.32));   // 生成圖放大超過約 2.5 倍會糊，提早交給下一層
    const o = Math.min(fin, fout);

    const o = Math.min(k1 === 0 ? 1 : Math.max(0, Math.min(1, (z - lo) / 0.45)), k2 === ZM.N - 1 ? 1 : Math.max(0, Math.min(1, (hi - z) / 0.35)));
    const sc = 1 + 0.35 * Math.max(0, Math.min(1, (z - lo) / (hi - lo)));

  });

  root.querySelector('#zm-vig').style.opacity = Math.max(0, Math.min(1, (z - 2.4) / 0.6)).toFixed(2);

  root.querySelector('#zm-w').textContent = zmFmt(W);
  const ref = ZM_REF.reduce((b, r) => Math.abs(Math.log10(r[0] / W)) < Math.abs(Math.log10(b[0] / W)) ? r : b);

// ===== 支線一第二頁：城市的一天 =====
// 數字都是示意：用來比較「哪條路最多、哪裡攔得到」，不是實測資料。
const CD_TYPES = { fiber: { img: 'mp_fiber', t: '纖維', c: '#3F86B0' }, tyre: { img: 'mp_tyre', t: '輪胎粉塵', c: '#2B2B2B' }, frag: { img: 'mp_fragment', t: '瓶子碎片', c: '#C9B46A' }, pellet: { img: 'mp_pellet', t: '原料粒', c: '#8FC7BE' }, paint: { img: 'mp_paint', t: '油漆碎屑', c: '#B5533C' }, bead: { img: 'mp_bead', t: '塑膠柔珠', c: '#A9CBE0' } };
const CD_PICK = [
  { k: 'filter', img: 'stop_filter', t: '洗衣機濾網', s: '攔下大部分纖維' },
  { k: 'sweep', img: 'street_sweeper', t: '雨前掃街', s: '下雨前把路面掃乾淨' },
  { k: 'net', img: 'drain_net', t: '雨水管口攔截網', s: '網住比較大的碎片' },
  { k: 'trap', img: 'pellet_trap', t: '工廠細網籃', s: '接住灑出來的原料粒' },
];
// 一天的事件：[時刻, 說明, 事件]
const CD_EV = [[7, '早上，洗衣服', 'wash'], [8, '上班通勤', 'drive'], [10, '工廠卸貨', 'pellet'], [12, '有人把瓶子丟在路邊，被車壓碎', 'litter'], [14, '漁船出港', 'boat'], [18, '下班通勤', 'drive'], [19.5, '晚上，大家都回家了', 'idle'], [22, '晚上洗臉（以前的洗面乳）', 'face'], [23.5, '雨前掃街', 'sweep'], [26, '半夜下大雨', 'rain'], [28.5, '雨停了，天快亮了', 'idle']];
const CD_SEW1 = 'V392 Q95 416 120 416 H330 Q356 416 366 440 Q376 466 402 466 H600', CD_SEW2 = 'M600 466 H770 Q830 466 845 478 Q858 488 860 500';
const CD_RAIN = 'L302 276 V330 Q302 349 322 349 H675 Q700 349 702 326 L712 322 Q735 330 742 352';
// 每一顆的去向在產生時就決定好：bay 海灣、sludge 污泥、filter/swept/net/trap 被攔下
function cdPlan(picks) {
  const P = [], has = k => picks.includes(k);
  for (let i = 0; i < 12; i++) P.push({ type: 'fiber', ev: 'wash', fate: has('filter') && i % 4 ? 'filter' : i % 5 ? 'sludge' : 'bay' });
  for (let i = 0; i < 12; i++) P.push({ type: 'tyre', ev: 'drive', n: i, fate: has('sweep') && i % 5 ? 'swept' : 'bay' });
  for (let i = 0; i < 5; i++) P.push({ type: 'frag', ev: 'litter', n: i, fate: has('sweep') && i % 5 ? 'swept' : has('net') ? 'net' : 'bay' });
  for (let i = 0; i < 6; i++) P.push({ type: 'pellet', ev: 'pellet', n: i, fate: has('trap') && i % 6 ? 'trap' : 'bay' });
  for (let i = 0; i < 3; i++) P.push({ type: 'paint', ev: 'boat', n: i, fate: 'bay' });
  for (let i = 0; i < 4; i++) P.push({ type: 'bead', ev: 'face', n: i, fate: i % 2 ? 'sludge' : 'bay' });
  return P;
}
function cdTally(P) {
  const bay = {}; let caught = 0, sludge = 0;
  P.forEach(p => { if (p.fate === 'bay') bay[p.type] = (bay[p.type] || 0) + 1; else if (p.fate === 'sludge') sludge++; else caught++; });
  return { bay, total: Object.values(bay).reduce((a, b) => a + b, 0), caught, sludge };
}

/* 目錄 */
.nb-toc{max-width:1240px;margin:0 auto;padding:20px clamp(12px,3vw,40px) 48px}
.tc-head{background:rgba(250,233,212,.95);border-radius:10px;padding:12px 18px;margin:0 auto 18px;max-width:900px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tc-head h2{margin:0;font:900 clamp(22px,2.4vw,32px) var(--serif)}
.tc-head p{margin:4px 0 0;font-size:14px;color:var(--mu);line-height:1.6}.tc-head p b{color:var(--stamp);margin-right:10px}
.tc-stage{position:relative;width:min(1180px,100%);aspect-ratio:1475/991;margin:0 auto}
.tc-book{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 20px 26px rgba(0,0,0,.55))}
.tc-map{position:absolute;left:6.5%;top:7.6%;width:87%;aspect-ratio:1536/1024;transform:rotate(-.7deg);filter:drop-shadow(0 3px 4px rgba(60,40,20,.35))}
.tc-map>img{width:100%;height:100%;display:block}
.tc-spot{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:grid;place-items:center;z-index:2}
.tc-spot.c{width:5.2%;aspect-ratio:1}.tc-spot.b{width:4.4%;aspect-ratio:1}
.tc-spot i{font:900 clamp(11px,1.5vw,20px) var(--serif);font-style:normal;color:#5A3A1E}
.tc-spot.b i{font-size:clamp(10px,1.2vw,16px)}
.tc-spot img{width:136%;max-width:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transition:transform .2s}
.tc-spot:not(.lit){border-radius:50%}.tc-spot.b:not(.lit){border-radius:3px}
.tc-spot:not(.lit):hover{background:rgba(242,177,52,.35)}
.tc-spot:hover img{transform:scale(1.12) rotate(-4deg)}
.tc-spot.new img{animation:tcStick .9s cubic-bezier(.3,1.6,.5,1) both,tcGlow 2.2s 1s ease-in-out infinite}
@keyframes tcStick{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes tcGlow{50%{filter:drop-shadow(0 0 8px #F2B134) drop-shadow(0 2px 2px rgba(0,0,0,.35))}}
.tc-tip{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#FFF6E6;font:700 13px "Noto Sans TC",sans-serif;padding:3px 8px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.tc-spot:hover .tc-tip,.tc-spot:focus-visible .tc-tip{opacity:1}
.tc-seal{position:absolute;width:15%;right:3%;top:-4%;transform:rotate(14deg);mix-blend-mode:multiply;z-index:3}
.tc-prof{position:absolute;width:15%;right:-7%;bottom:-9%;z-index:3;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));pointer-events:none}
.tc-list{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-top:30px}
.tc-g{background:rgba(250,233,212,.95);border-radius:10px;padding:12px 14px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.tc-g h3{margin:0 0 8px;font:900 16px var(--serif)}
.tc-g.g-src h3{color:#B5632C}.tc-g.g-rec h3{color:#3E7E6A}
.tc-g>div{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.sv .tc-item{position:relative;display:grid;grid-template-columns:40px 1fr;align-items:center;gap:0 8px;text-align:left;background:#FFF8EA;border:1px solid var(--rule);border-radius:6px;padding:5px 8px;min-height:52px}
.tc-item img{grid-row:span 2;width:40px;height:40px}.tc-item:not(.lit) img{opacity:.6}
.tc-item b{font:900 15px/1.2 var(--serif)}.tc-item span{font-size:12px;color:var(--mu)}
.tc-item:hover{border-color:#C79A4E;background:#FFF}
.tc-item em{position:absolute;top:-7px;right:6px;font:700 11px "Noto Sans TC",sans-serif;font-style:normal;background:#F2B134;color:#3B2A10;padding:0 6px;border-radius:8px}
.tc-spot.free:not(.lit){background:#FFF8EA;border:2.5px solid #5A3A1E;box-shadow:0 2px 4px rgba(0,0,0,.3)}
/* v1.2 被吃下去：做做看 */
.a-eat{grid-template-columns:minmax(0,1fr) minmax(240px,340px)}
.eat-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv .eat-pick button{display:grid;justify-items:center;gap:4px;background:#FFFDF6;border:2px solid var(--rule);border-radius:10px;padding:8px 6px;font:900 15px var(--serif)}
.sv .eat-pick button:hover{border-color:#C79A4E}
.sv .eat-pick button[aria-pressed=true]{border-color:var(--stamp);box-shadow:0 0 0 3px #F3D5C8;background:#FFF}
.eat-pick img{width:100%;max-width:150px;aspect-ratio:1.15;object-fit:contain}
.eat-q{margin-top:8px;border:1px solid var(--rule);border-radius:8px;background:#FFFDF6;padding:6px 12px}
.eat-q summary{cursor:pointer;font:800 14.5px var(--serif);color:var(--ink);min-height:30px;display:flex;align-items:center}
.eat-q p{margin:6px 0 4px!important;color:var(--ink)!important}
@media (max-width:980px){.a-eat{grid-template-columns:1fr}}
@media (max-width:1180px){.tc-prof{display:none}}
@media (max-width:980px){
  .sv{background-attachment:scroll}
  .sv-wrap{width:calc(100% - 20px);margin:14px auto 28px;box-shadow:0 0 0 6px #2F4A35,0 0 0 7px #1C2E22,0 12px 30px rgba(0,0,0,.5)}
  .sv-wrap::after{height:60px;width:16px}
  .cv-stage{flex-direction:column;gap:18px}.cv-book{width:min(240px,58vw)}.nb-cover{padding-top:18px;place-items:start center}
  .cv-side{max-width:520px}.cv-profw{margin-top:-40px}.cv-prof{width:110px}
  .tc-list{grid-template-columns:1fr}
  .tc-spot .tc-tip{display:none}
  .sv-narrw .sv-clip{width:64px;height:84px}
  .sv[data-view=page] .sv-tocb[data-sv-view=cover]{display:none}
}
@media (max-width:560px){.tc-spot i{font-size:9px}.tc-g>div{grid-template-columns:1fr 1fr}.cv-label small{display:none}}
@media (prefers-reduced-motion:reduce){.tc-spot.new img{animation:none}}
@media (prefers-reduced-motion:reduce){.sv *{transition:none!important;animation:none!important}}
`;

function svVisible(c) {
  const ch = SV_CH[SV.ch];
  if (ch.imgPre && !SV.act.stamped) return false;
  if (!ch.lab) return true;
  if (c.only !== undefined) return SV.tool === c.only;
  return SV.tool >= (c.tool || 0);
}

// 畫面上的排列順序：左欄由上到下，再右欄由上到下；手機版的編號也照這個順序
function svOrder(ch) {
  const all = ch.callouts.map((c, i) => ({ c, i })).filter(o => svVisible(o.c)).sort((a, b) => a.c.y - b.c.y);
  return [...all.filter(o => o.c.side === 'L'), ...all.filter(o => o.c.side === 'R')];
}

        <div class="sv-tools" id="sv-tools" hidden>${SV_TOOLS.map((t, i) => `<button data-sv-tool="${i}" aria-pressed="false"><img src="img/icon_${['eye', 'magnifier', 'microscope'][i]}.png" alt="">${t}</button>`).join('')}</div>

// ===== v1.1 白教授的野外筆記本：封面與目錄 =====
// 目錄是一張河流路線圖（img/atlas_route）。主線 8 章在河上的圓圈；支線一往城裡的水溝、支線二往回收倉庫，放在虛線上的方框。
// 座標是路線圖上的百分比（原圖 1536×1024 量的）。v1.2 加了〈被吃下去〉：它用河上第 7 個圓圈，〈放大看〉改貼在燈塔沙灘（沒有圓圈，程式畫一個）。
const NB_SPOT = {
  make: [11.7, 22.2], whole: [16.5, 31.3], crushed: [24.0, 37.6], rain: [29.9, 44.7], weather: [42.8, 52.0], bay: [51.1, 58.8], eaten: [57.6, 70.1], zoom: [45.6, 77.4], lab: [68.7, 74.6],
  src: [47.7, 22.4], srcday: [61.8, 21.3],
  rflow: [32.4, 67.3], rtank: [26.5, 67.0], rfork: [20.8, 67.0], rstop: [15.6, 74.2],
};
const nbDone = () => Atlas.count() >= Atlas.total();
const nbIcon = c => Atlas.isLit(c.key) ? `img/stk_${c.key}.png` : 'img/atlas_slot.png';
function svCoverHTML() {
  const N = ATLAS_UI.nb, n = Atlas.count(), all = Atlas.total();
  return `<div class="cv-stage">
    <button class="cv-book" data-sv-view="toc" aria-label="${N.open}">
      <img class="cv-img" src="img/atlas_cover.webp" alt="">
      <span class="cv-label"><b>${N.title}</b><small>${N.sub}</small></span>
      ${nbDone() ? `<img class="cv-seal" src="img/atlas_seal.png" alt="${N.done}">` : ''}
    </button>
    <div class="cv-side">
      <div class="cv-profw"><img class="cv-prof" src="img/atlas_prof.webp" alt="${N.who}"><p class="cv-say">${N.say}<small>——${N.who}</small></p></div>
      <p class="cv-prog">${fmt(ATLAS_UI.count, { n, all })}</p>
      <div class="cv-strip" aria-hidden="true">${SV_CH.map(c => `<img class="${Atlas.isLit(c.key) ? 'lit' : ''}" src="${nbIcon(c)}" alt="">`).join('')}</div>
      <p class="cv-hint">${nbDone() ? N.done : N.coverHint}</p>
      <button class="cv-open" data-sv-view="toc">${N.open} →</button>
    </div>
  </div>`;
}
function svTocHTML() {
  const N = ATLAS_UI.nb;
  const fresh = c => Atlas.isLit(c.key) && !Atlas.isRead(c.key);
  const spot = (c, i) => {
    const [x, y] = NB_SPOT[c.key], g = svGroup(i), lit = Atlas.isLit(c.key), num = svGroupIdx(g).indexOf(i) + 1;
    return `<button class="tc-spot ${g === 'main' ? 'c' : 'b'}${c.key === 'zoom' ? ' free' : ''}${lit ? ' lit' : ''}${fresh(c) ? ' new' : ''}" style="left:${x}%;top:${y}%" data-sv-ch="${i}" aria-label="${c.nav}（${lit ? ATLAS_UI.lit : ATLAS_UI.unlit}）">${lit ? `<img src="img/stk_${c.key}.png" alt="">` : `<i>${num}</i>`}<span class="tc-tip">${c.nav}</span></button>`;
  };
  const item = (c, i) => `<button class="tc-item${Atlas.isLit(c.key) ? ' lit' : ''}${fresh(c) ? ' new' : ''}" data-sv-ch="${i}"><img src="${nbIcon(c)}" alt=""><b>${c.nav}</b><span>${c.navSub}</span>${fresh(c) ? `<em>${N.fresh}</em>` : ''}</button>`;
  const grp = g => `<section class="tc-g g-${g}"><h3>${N[g]}</h3><div>${svGroupIdx(g).map(i => item(SV_CH[i], i)).join('')}</div></section>`;
  return `<div class="tc-head"><h2>${N.tocH}</h2><p><b>${fmt(ATLAS_UI.count, { n: Atlas.count(), all: Atlas.total() })}</b>${N.tocHint}</p></div>
  <div class="tc-stage">
    <img class="tc-book" src="img/atlas_book.webp" alt="">
    <div class="tc-map"><img src="img/atlas_route.webp" alt="貝洛港的河流路線圖：河從山坡流過市集，進到海灣">${SV_CH.map(spot).join('')}</div>
    ${nbDone() ? `<img class="tc-seal" src="img/atlas_seal.png" alt="">` : ''}
    <img class="tc-prof" src="img/atlas_prof.webp" alt="">
  </div>
  <div class="tc-list">${['main', 'src', 'rec'].map(grp).join('')}</div>`;
}

function mountInteractiveStory() {
  const root = document.getElementById('interactive-story'); if (!root) return;
  const $ = id => root.querySelector('#' + id);
  const fig = $('sv-fig'), box = $('sv-imgbox'), img = $('sv-img'), L = $('sv-L'), R = $('sv-R'), lines = $('sv-lines');
  let swapTimer = null, playRaf = 0;
  const zoomEl = $('sv-zoom'), svgfig = $('sv-svgfig');
  const stopPlay = () => { cancelAnimationFrame(playRaf); playRaf = 0; const b = $('zm-play'); if (b) b.textContent = '▶ 自動放大'; };

  function layout() {
    const ch = SV_CH[SV.ch], fr = fig.getBoundingClientRect(), br = box.getBoundingClientRect();
    const narrow = window.innerWidth <= 980;
    lines.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
    const pt = c => [br.left - fr.left + c.x / 100 * br.width, br.top - fr.top + c.y / 100 * br.height];
    // 標註依點的高度排，再把重疊的往下推、超出底部的往上推
    for (const col of [L, R]) {
      const labs = [...col.querySelectorAll('.sv-lab')].filter(el => !el.hidden);
      if (narrow) { labs.forEach(el => el.style.top = ''); continue; }
      const items = labs.map(el => ({ el, want: pt(ch.callouts[+el.dataset.i])[1] - el.offsetHeight / 2, h: el.offsetHeight })).sort((a, b) => a.want - b.want);
      let y = -Infinity; items.forEach(o => { o.top = Math.max(o.want, y + 10); y = o.top + o.h; });
      const over = y - fr.height; if (over > 0) for (let k = items.length - 1, lim = fr.height; k >= 0; k--) { items[k].top = Math.min(items[k].top, lim - items[k].h); lim = items[k].top - 10; }
      items.forEach(o => o.el.style.top = Math.max(0, o.top) + 'px');
    }
    let svg = '';
    svOrder(ch).forEach(({ c, i }, n) => {
      const [px, py] = pt(c), el = root.querySelector(`.sv-lab[data-i="${i}"]`); if (!el) return;
      const er = el.getBoundingClientRect(), on = SV.active === i ? ' on' : '', g = c.game ? ' g' : '';
      const ax = c.side === 'L' ? er.right - fr.left - 4 : er.left - fr.left + 4, ay = er.top - fr.top + Math.min(er.height / 2, 14);
      if (!narrow) svg += `<line class="${g}${on}" x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}"></line>`;
      svg += `<circle class="${g}${on}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${narrow ? 9 : 4}"></circle>`;
      if (narrow) svg += `<text x="${px.toFixed(1)}" y="${(py + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#2B3A40">${n + 1}</text>`;
    });
    if (ch.rings && SV.tool === 2) ch.rings.forEach(([x, y]) => { const [px, py] = pt({ x, y }); svg += `<circle class="ring" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${Math.max(12, br.width * 0.028).toFixed(1)}"></circle>`; });
    lines.innerHTML = svg;
  }

  function fillLabels() {
    const ch = SV_CH[SV.ch], num = new Map(svOrder(ch).map((o, n) => [o.i, n + 1]));
    const lab = (c, i) => `<button class="sv-lab${c.game ? ' g' : ''}${SV.active === i ? ' on' : ''}" data-i="${i}" ${svVisible(c) ? '' : 'hidden'}><span class="n">${num.get(i) || ''}</span><b>${c.t}</b><small>${c.s}</small></button>`;
    const byPt = (a, b) => a.c.y - b.c.y;
    const all = ch.callouts.map((c, i) => ({ c, i })).sort(byPt);
    L.innerHTML = all.filter(o => o.c.side === 'L').map(o => lab(o.c, o.i)).join('');
    R.innerHTML = all.filter(o => o.c.side === 'R').map(o => lab(o.c, o.i)).join('');
  }

  function show(ci, keepTool) {
    const changed = ci !== SV.ch; SV.ch = ci; SV.active = null;
    const ch = SV_CH[ci];
    if (changed) SV.g = null;
    Atlas.read(ch.key); svLit();
    if (!keepTool) SV.tool = 0;
    $('sv-title').textContent = ch.title; $('sv-time').textContent = ch.time;
    const pre = ch.narrPre && !SV.act.stamped;
    if (changed) stopPlay();
    const g = svGroup(ci); root.dataset.group = g;
    $('sv-h1').innerHTML = SV_BR[g].h1; $('sv-file').textContent = SV_BR[g].file;
    fig.hidden = !!(ch.zoom || ch.stage); zoomEl.hidden = !ch.zoom;
    ['match', 'tank', 'fork', 'stop', 'drift', 'city'].forEach(k => { $('sv-' + k).hidden = ch.stage !== k; });
    if (changed) { drStop(); cdStop(); }
    $('sv-band').hidden = !!ch.branch && ch.stage !== 'stop';
    if (ch.zoom) svZoomUpdate(root);
    if (ch.stage === 'match') svMatchUpdate(root);
    if (ch.stage === 'tank') svTankUpdate(root);
    if (ch.stage === 'fork') svForkUpdate(root);
    if (ch.stage === 'stop') svStopUpdate(root);
    if (ch.stage === 'drift') { svDriftUpdate(root); drCard(); }
    if (ch.stage === 'city') cdRender();
    const narrT = pre ? ch.narrPre : Array.isArray(ch.narr) ? ch.narr[SV.tool] : ch.narr;
    $('sv-narr').textContent = narrT;
    { const who = $('sv-who'), f = typeof faceOf === 'function' ? faceOf(narrT) : null; $('sv-clip').hidden = !f; if (f) { who.src = `img/${f[1]}.webp`; who.alt = f[0]; } }
    root.querySelectorAll('[data-sv-ch]').forEach(b => { if (+b.dataset.svCh === ci) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    $('sv-tools').hidden = !ch.lab; $('sv-tools').classList.toggle('hint', SV.tool < 2);
    const act = $('sv-act'), ah = svActHTML(ci); act.innerHTML = ah; act.hidden = !ah;
    if (ch.key === 'rain') svRain(root);
